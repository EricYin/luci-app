## ============================================================================
##  Build LuCI packages  —  qwe-qaq/luci-app
##
##  仓库根目录下每个 luci-app-* 目录就是一个 OpenWrt/LuCI 软件包。
##
##  job 一览：
##    check      结构 + shell 静态检查（编译前先挡住「装上去才发现」的错误）
##    build      OpenWrt 25.12+ 的 apk 包：apk-tools 静态二进制 `apk mkpkg` 组装
##    build-ipk  24.10 及更早分支（opkg/.ipk）设备用：脚本手工组装 ipk
##    release    构建成功即发布到 Releases：
##               - push 到 main → 滚动更新 `snapshot` Release（prerelease）
##               - 打 v* tag   → 以 tag 名建正式 Release
##
##  两个 build job 都**不用 docker、不用 SDK**：仓库里的包是纯数据包
##  （js/shell/json，无 C 代码），不需要交叉编译器，依赖也只是写进元数据。
##  全程无镜像拉取、无 feeds 初始化，两个 job 各几十秒。
##  产物都是 noarch，arm64 设备直接装（不用再为架构铺矩阵）。
##
##  ── 安装说明 ────────────────────────────────────────────────────────────────
##  25.12+（apk）：  apk add --allow-untrusted ./luci-app-xxx-<ver>.apk
##  24.10-（ipk）：  opkg install ./luci-app-xxx_<ver>_all.ipk
##
##  ── 说明 ──────────────────────────────────────────────────────────────────
##  * 依赖只写进包元数据，构建过程不检查依赖是否真实存在。官方源里没有的包
##    （如 airoha-ponctl、kmod-nft-fullcone）装到路由器上前请自备。
##  * 打包脚本：apk → .github/scripts/build-apk.sh；ipk → build-ipk.sh。
## ============================================================================
name: Build LuCI packages

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      ipk_arch:
        description: 'ipk 的 Architecture 字段（默认 all，arm64 设备通用）'
        required: false
        default: 'all'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # --------------------------------------------------------------------------
  # 静态检查：编译前先挡住「装上去才发现」的低级错误
  # --------------------------------------------------------------------------
  check:
    name: Structure & ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck jq

      - name: LuCI 包结构校验
        run: bash .github/scripts/check-luci-structure.sh

      # 只把 error 级别当失败。仓库里现有脚本若只是 warning/style 不干净，
      # 不会因此变红。等清理干净后可以把 --severity 提到 warning。
      - name: "ShellCheck (blocking / error only)"
        run: |
          set -euo pipefail
          files=()
          mapfile -t files < <(grep -rIl -E '^#![[:space:]]*(/usr)?/bin/(env[[:space:]]+)?(ba)?sh' . --exclude-dir=.git || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'no shell script found'
            exit 0
          fi
          printf 'checking %d shell script(s)\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          shellcheck -x --severity=error -e SC1091 "${files[@]}"

      - name: "ShellCheck (advisory / warning and above)"
        continue-on-error: true
        run: |
          files=()
          mapfile -t files < <(grep -rIl -E '^#![[:space:]]*(/usr)?/bin/(env[[:space:]]+)?(ba)?sh' . --exclude-dir=.git || true)
          [ "${#files[@]}" -gt 0 ] || exit 0
          shellcheck -x --format=gcc --severity=warning -e SC1091,SC3043 "${files[@]}"

      - name: JSON 语法校验
        run: |
          set -euo pipefail
          n=0
          while IFS= read -r f; do
            jq empty "$f"
            n=$((n + 1))
          done < <(find . -name '*.json' -not -path './.git/*' -type f | sort)
          echo "validated $n json file(s)"

  # --------------------------------------------------------------------------
  # 打包 apk：无 SDK、无 docker。包是纯数据包（js/shell/json，无 C 代码），
  # 用 apk-tools 官方的 `apk mkpkg` 直接组装 OpenWrt 25.12 的 apk 包，
  # 与 buildroot 25.12 的打包路径一致（include/package-pack.mk apk 分支）。
  # 相比 gh-action-sdk 省掉镜像拉取 + feeds 初始化，全程 < 1 分钟。
  # 产物为 noarch，任意 OpenWrt 25.12 设备（不限 ARM64）通用。
  # --------------------------------------------------------------------------
  build:
    name: Build apk (no-SDK)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install apk-tools (official static binary, no docker)
        run: |
          set -euo pipefail
          base="https://dl-cdn.alpinelinux.org/alpine/latest-stable/main/x86_64"
          name="$(curl -fsSL "$base/" | grep -oE 'apk-tools-static-[0-9][^"]*\.apk' | sort -uV | tail -1)"
          [ -n "$name" ] || { echo 'apk-tools-static not found on Alpine CDN' >&2; exit 1; }
          echo "using $name"
          curl -fsSL -o apk-tools-static.apk "$base/$name"
          tar -xzf apk-tools-static.apk sbin/apk.static
          chmod +x sbin/apk.static
          ./sbin/apk.static --version

      - name: Build packages
        run: bash .github/scripts/build-apk.sh ./sbin/apk.static dist

      - name: Upload apk
        uses: actions/upload-artifact@v7
        with:
          name: apk-openwrt-25.12
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------------------
  # 打包 ipk：OpenWrt 24.10 及更早分支用的还是 opkg/.ipk。
  # 同样不碰 docker —— 直接用 tar 组装 opkg 的 ipk 格式
  # （debian-binary + control.tar.gz + data.tar.gz），跟 buildroot 的
  # scripts/ipkg-build 产出一致，比拉 SDK 镜像快一个数量级。
  #
  # 包是纯数据（js/shell/json），Architecture 写 all（noarch），
  # arm64 / x86 设备都能装，所以不为架构铺矩阵：一次构建，全平台通用。
  # 想让包名打上 arm64 标签就手动跑本 workflow，把 ipk_arch 填成
  # aarch64_cortex-a53（前提：设备 /etc/opkg.conf 里列了该 arch 条目）。
  #
  # 打包脚本 .github/scripts/build-ipk.sh 负责：
  #   * root/ → /，htdocs/ → /www
  #   * 给 usr/sbin、usr/bin、etc/init.d、etc/uci-defaults 下的文件补可执行位
  #   * /etc 下的文件写进 conffiles（升级不覆盖）
  #   * 生成 postinst（清 LuCI 缓存 + reload rpcd）
  # --------------------------------------------------------------------------
  build-ipk:
    name: Build ipk (no-SDK)
    needs: check
    runs-on: ubuntu-latest
    env:
      IPK_ARCH: ${{ github.event.inputs.ipk_arch || 'all' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build packages
        run: bash .github/scripts/build-ipk.sh dist

      # 抽查一下产物结构：control 字段、conffiles、可执行位
      - name: Inspect ipk
        run: |
          set -euo pipefail
          for f in dist/*.ipk; do
            echo "=== $f"
            tar -tzf "$f"
            echo "--- control"
            tar -xzOf "$f" ./control.tar.gz | tar -xzO ./control
            echo "--- conffiles"
            tar -xzOf "$f" ./control.tar.gz | tar -xzO ./conffiles
            echo "--- data (权限位)"
            tar -xzOf "$f" ./data.tar.gz | tar -tvz
          done

      - name: Upload ipk
        uses: actions/upload-artifact@v7
        with:
          name: ipk-opkg
          path: dist/*.ipk
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------------------
  # 发布：构建成功就把 .apk / .ipk 一起发到 Releases
  #   * push 到 main   → 滚动 Release `snapshot`（prerelease，每次整建重建，
  #                      始终对应当前 main；用户直接到 Releases 页下载即可）
  #   * 打 v* tag      → 以 tag 名建正式 Release
  # --------------------------------------------------------------------------
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: [build, build-ipk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download apk artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: apk-*
          merge-multiple: true
          path: dist

      - name: Download ipk artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ipk-*
          merge-multiple: true
          path: dist

      - name: List files
        run: ls -lR dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.apk dist/*.ipk)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no package to publish"
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            title="$tag"
            extra=(--generate-notes)
          else
            tag="snapshot"
            title="snapshot（最新构建 · 25.12 apk + 24.10 ipk）"
            notes="$(printf 'main 分支自动构建，每次推送整建重建，始终为最新版本。\n\n安装：\n    apk add --allow-untrusted ./luci-app-xxx-<version>.apk\n    opkg install ./luci-app-xxx_<version>_all.ipk')"
            extra=(--prerelease --notes "$notes")

            # 滚动发布：删除旧 snapshot（连同 tag）后整建，避免遗留被改名/删除的旧文件
            if gh release view "$tag" -R "$REPO" >/dev/null 2>&1; then
              gh release delete "$tag" -R "$REPO" --cleanup-tag --yes
            elif git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
              git push origin ":refs/tags/$tag"
            fi
          fi

          printf 'publishing %d file(s) to %s\n' "${#files[@]}" "$tag"
          gh release create "$tag" "${files[@]}" -R "$REPO" --title "$title" "${extra[@]}"
