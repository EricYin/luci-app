## ============================================================================
##  Build LuCI packages  —  qwe3017/luci-app
##
##  仓库根目录下每个 luci-app-* 目录就是一个 OpenWrt/LuCI 软件包。
##  这些包是纯数据包（js/shell/json，无 C 代码），所以不走官方 SDK 容器：
##  直接用 apk-tools 官方静态二进制的 `apk mkpkg` 组装 OpenWrt 25.12 的 apk 包
##  （25.12 起包管理器已从 opkg/.ipk 切换为 apk/.apk）。全程无 docker，< 1 分钟。
##
##  两个 job（并行）：
##    check    结构 + shell 静态检查
##    build    无 SDK 打包所有 luci-app-*，产物为 noarch apk，任何 25.12 设备通用
##    release  构建成功即发布 apk 到 Releases：
##             - push 到 main → 滚动更新 `snapshot` Release（prerelease，始终最新）
##             - 打 v* tag   → 以 tag 名建正式 Release
##
##  ── 安装说明 ────────────────────────────────────────────────────────────────
##  产物未签名，设备上安装：
##      apk add --allow-untrusted ./luci-app-xxx-<version>.apk
##
##  ── 说明 ──────────────────────────────────────────────────────────────────
##  * 依赖只写进包元数据（depends 字段），构建过程不检查依赖是否真实存在；
##    装到路由器上前请确认依赖包已就位（例如 airoha-ponctl 非官方包，需自备）。
##  * 打包逻辑见 .github/scripts/build-apk.sh。
## ============================================================================
name: Build LuCI packages

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # --------------------------------------------------------------------------
  # 静态检查：编译前先挡住「装上去才发现」的低级错误
  # --------------------------------------------------------------------------
  check:
    name: Structure & ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck jq

      - name: LuCI 包结构校验
        run: bash .github/scripts/check-luci-structure.sh

      # 只把 error 级别当失败。仓库里现有脚本若只是 warning/style 不干净，
      # 不会因此变红。等清理干净后可以把 --severity 提到 warning。
      - name: "ShellCheck (blocking / error only)"
        run: |
          set -euo pipefail
          files=()
          mapfile -t files < <(grep -rIl -E '^#![[:space:]]*(/usr)?/bin/(env[[:space:]]+)?(ba)?sh' . --exclude-dir=.git || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'no shell script found'
            exit 0
          fi
          printf 'checking %d shell script(s)\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          shellcheck -x --severity=error -e SC1091 "${files[@]}"

      - name: "ShellCheck (advisory / warning and above)"
        continue-on-error: true
        run: |
          files=()
          mapfile -t files < <(grep -rIl -E '^#![[:space:]]*(/usr)?/bin/(env[[:space:]]+)?(ba)?sh' . --exclude-dir=.git || true)
          [ "${#files[@]}" -gt 0 ] || exit 0
          shellcheck -x --format=gcc --severity=warning -e SC1091,SC3043 "${files[@]}"

      - name: JSON 语法校验
        run: |
          set -euo pipefail
          n=0
          while IFS= read -r f; do
            jq empty "$f"
            n=$((n + 1))
          done < <(find . -name '*.json' -not -path './.git/*' -type f | sort)
          echo "validated $n json file(s)"

  # --------------------------------------------------------------------------
  # 打包：无 SDK、无 docker。包是纯数据包（js/shell/json，无 C 代码），
  # 用 apk-tools 官方的 `apk mkpkg` 直接组装 OpenWrt 25.12 的 apk 包，
  # 与 buildroot 25.12 的打包路径一致（include/package-pack.mk apk 分支）。
  # 相比 gh-action-sdk 省掉镜像拉取 + feeds 初始化，全程 < 1 分钟。
  # 产物为 noarch，任意 OpenWrt 25.12 设备（不限 ARM64）通用。
  # --------------------------------------------------------------------------
  build:
    name: Build apk (no-SDK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install apk-tools (official static binary, no docker)
        run: |
          set -euo pipefail
          base="https://dl-cdn.alpinelinux.org/alpine/latest-stable/main/x86_64"
          name="$(curl -fsSL "$base/" | grep -oE 'apk-tools-static-[0-9][^"]*\.apk' | sort -uV | tail -1)"
          [ -n "$name" ] || { echo 'apk-tools-static not found on Alpine CDN' >&2; exit 1; }
          echo "using $name"
          curl -fsSL -o apk-tools-static.apk "$base/$name"
          tar -xzf apk-tools-static.apk sbin/apk.static
          chmod +x sbin/apk.static
          ./sbin/apk.static --version

      - name: Build packages
        run: bash .github/scripts/build-apk.sh ./sbin/apk.static dist

      - name: Upload apk
        uses: actions/upload-artifact@v7
        with:
          name: apk-openwrt-25.12
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------------------
  # 发布：构建成功就把 .apk 发到 Releases
  #   * push 到 main   → 滚动 Release `snapshot`（prerelease，每次整建重建，
  #                      始终对应当前 main；用户直接到 Releases 页下载即可）
  #   * 打 v* tag      → 以 tag 名建正式 Release
  # --------------------------------------------------------------------------
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: apk-*
          merge-multiple: true
          path: dist

      - name: List files
        run: ls -lR dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.apk)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no package to publish"
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            title="$tag"
            extra=(--generate-notes)
          else
            tag="snapshot"
            title="snapshot（最新构建 · OpenWrt 25.12 noarch）"
            notes="$(printf 'main 分支自动构建，每次推送整建重建，始终为最新版本。\n\n安装：\n    apk add --allow-untrusted ./luci-app-xxx-<version>.apk')"
            extra=(--prerelease --notes "$notes")

            # 滚动发布：删除旧 snapshot（连同 tag）后整建，避免遗留被改名/删除的旧文件
            if gh release view "$tag" -R "$REPO" >/dev/null 2>&1; then
              gh release delete "$tag" -R "$REPO" --cleanup-tag --yes
            elif git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
              git push origin ":refs/tags/$tag"
            fi
          fi

          printf 'publishing %d file(s) to %s\n' "${#files[@]}" "$tag"
          gh release create "$tag" "${files[@]}" -R "$REPO" --title "$title" "${extra[@]}"
