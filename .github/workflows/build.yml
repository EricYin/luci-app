name: "Build & Lint"

on:
  push:
分支:
      - master
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
分支:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "Build ${{ matrix.arch }}-${{ matrix.branch }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            branch: SNAPSHOT
          - arch: mipsel_24kc
            branch: SNAPSHOT
          - arch: aarch64_cortex-a53
            branch: SNAPSHOT
          - arch: x86_64
            branch: openwrt-23.05
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package with OpenWrt SDK
        uses: openwrt/gh-action-sdk@v5
        env:
          ARCH: ${{ matrix.arch }}
          BRANCH: ${{ matrix.branch }}
          FEEDNAME: natmode_ci
          PACKAGES: luci-app-natmode

      - name: Upload ipk artifact
        uses: actions/upload-artifact@v4
        with:
          name: "luci-app-natmode_${{ matrix.arch }}_${{ matrix.branch }}"
          path: "bin/packages/${{ matrix.arch }}/natmode_ci/luci-app-natmode*.ipk"
          if-no-files-found: error

  shellcheck:
    name: "ShellCheck"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update -y && sudo apt-get install -y shellcheck

      - name: Lint natmode-apply
        run: shellcheck -x root/usr/sbin/natmode-apply

      - name: Lint init.d/natmode
        # init.d scripts get procd_* functions injected at runtime by /etc/rc.common,
        # so ShellCheck cannot source them. Ignore SC1091 (file not found).
        run: shellcheck -x -e SC1091 root/etc/init.d/natmode
