## ============================================================================
##  Build LuCI packages  —  qwe3017/luci-app
##
##  仓库根目录下每个 luci-app-* 目录就是一个 OpenWrt/LuCI 软件包，
##  直接作为 src-link feed 交给官方 SDK 容器编译，产出 .ipk 附件。
##
##  四个 job：
##    check         结构 + shell 静态检查（与 build 并行，结果在 Annotations 里看）
##    build         每个 SDK 目标一个 job，一次编完所有 luci-app-* 包，上传 artifact
##    build-manual  手动指定 SDK tag 临时编译（只在 workflow_dispatch 填了 sdk 时跑）
##    release       打 v* tag 时，把本轮所有 .ipk 挂到 GitHub Release 上
##
##  ── 关于 SDK 目标（matrix.sdk）────────────────────────────────────────────
##  当前只构建 OpenWrt 25.12 的 ARM64 包：
##      aarch64_cortex-a53-25.12-SNAPSHOT   25.12 分支快照，跟随分支最新包源，
##                                          不会因小版本更迭失效
##  两个包都是纯 LuCI 应用，编译产物是 all 架构 ipk，可装到任意 ARM64 设备；
##  换设备变体（cortex-a72/a76/generic）时改下面的 sdk 列表即可。
##  临时用别的 tag 编译：Actions -> 本工作流 -> Run workflow -> 填 sdk。
##
##  ── 说明 ──────────────────────────────────────────────────────────────────
##  * 依赖里出现 SDK 官方 feed 里没有的包（例如 luci-app-pon-status 的
##    airoha-ponctl）时，打包脚本会打印一条 warning 并把该依赖从 ipk 的
##    control 里丢掉，编译本身不会失败。装到路由器上前请确认这个包已就位。
##  * 产物路径用 bin/packages/** 通配，因为 bin/packages/ 下的一级目录是
##    架构名（aarch64_cortex-a53），与 SDK tag（aarch64_cortex-a53-25.12-SNAPSHOT）并不相同。
## ============================================================================
name: Build LuCI packages

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      sdk:
        description: '临时编译用的 SDK 镜像 tag，例如 aarch64_cortex-a53-25.12-SNAPSHOT。留空则只跑默认矩阵'
        type: string
        required: false
        default: ''
      packages:
        description: '要编译的包目录名，空格分隔'
        type: string
        required: false
        default: 'luci-app-natmode luci-app-pon-status'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # --------------------------------------------------------------------------
  # 静态检查：编译前先挡住「装上去才发现」的低级错误
  # --------------------------------------------------------------------------
  check:
    name: Structure & ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck jq

      - name: LuCI 包结构校验
        run: bash .github/scripts/check-luci-structure.sh

      # 只把 error 级别当失败。仓库里现有脚本若只是 warning/style 不干净，
      # 不会因此变红。等清理干净后可以把 --severity 提到 warning。
      - name: "ShellCheck (blocking / error only)"
        run: |
          set -euo pipefail
          files=()
          mapfile -t files < <(grep -rIl -E '^#![[:space:]]*(/usr)?/bin/(env[[:space:]]+)?(ba)?sh' . --exclude-dir=.git || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'no shell script found'
            exit 0
          fi
          printf 'checking %d shell script(s)\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          shellcheck -x --severity=error -e SC1091 "${files[@]}"

      - name: "ShellCheck (advisory / warning and above)"
        continue-on-error: true
        run: |
          files=()
          mapfile -t files < <(grep -rIl -E '^#![[:space:]]*(/usr)?/bin/(env[[:space:]]+)?(ba)?sh' . --exclude-dir=.git || true)
          [ "${#files[@]}" -gt 0 ] || exit 0
          shellcheck -x --format=gcc --severity=warning -e SC1091,SC3043 "${files[@]}"

      - name: JSON 语法校验
        run: |
          set -euo pipefail
          n=0
          while IFS= read -r f; do
            jq empty "$f"
            n=$((n + 1))
          done < <(find . -name '*.json' -not -path './.git/*' -type f | sort)
          echo "validated $n json file(s)"

  # --------------------------------------------------------------------------
  # 编译：每个 SDK 目标一个 job，一次编完所有 luci-app-* 包。
  # 不再按包拆矩阵：SDK 镜像拉取 + feeds 初始化是每 job 固定开销（数分钟），
  # 拆开后每个包都要付一遍，合并后总耗时取决于最慢的单包而非「检查+重复初始化」。
  # 包列表自动探测，新增包目录无需改本文件。
  # 与 check 并行跑：结构错误本来也会让编译挂掉，没必要串行等它。
  # --------------------------------------------------------------------------
  build:
    name: Build · ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk:
          # 只构建 OpenWrt 25.12 · ARM64；产物为 all 架构 ipk，通用所有 ARM64 设备
          - aarch64_cortex-a53-25.12-SNAPSHOT
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect packages
        run: |
          set -euo pipefail
          pkgs="$(find . -maxdepth 1 -type d -name 'luci-app-*' -printf '%f ' | sed 's/ $//')"
          [ -n "$pkgs" ] || { echo 'no luci-app-* package found'; exit 1; }
          echo "PKGS=$pkgs" >> "$GITHUB_ENV"
          echo "packages to build: $pkgs"

      - name: Build for ${{ matrix.sdk }}
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: ${{ matrix.sdk }}
          FEEDNAME: luci_app_ci
          PACKAGES: ${{ env.PKGS }}
          BUILD_LOG: 1

      - name: Upload ipk / apk
        uses: actions/upload-artifact@v5
        with:
          name: ipk-${{ matrix.sdk }}
          path: |
            bin/packages/**/*.ipk
            bin/packages/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: logs-${{ matrix.sdk }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

  # --------------------------------------------------------------------------
  # 手动编译：Run workflow 时填了 sdk 才会跑，一次编完所有包
  # --------------------------------------------------------------------------
  build-manual:
    name: Manual build · ${{ inputs.sdk }}
    if: github.event_name == 'workflow_dispatch' && inputs.sdk != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build ${{ inputs.packages }} for ${{ inputs.sdk }}
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: ${{ inputs.sdk }}
          FEEDNAME: luci_app_ci
          PACKAGES: ${{ inputs.packages }}
          IGNORE_ERRORS: 1
          BUILD_LOG: 1

      - name: Upload ipk / apk
        uses: actions/upload-artifact@v5
        with:
          name: ipk-manual-${{ inputs.sdk }}
          path: |
            bin/packages/**/*.ipk
            bin/packages/**/*.apk
          if-no-files-found: warn
          retention-days: 14

  # --------------------------------------------------------------------------
  # 发布：打 v* tag 时，把矩阵产出的所有 .ipk 合成一个 Release
  # --------------------------------------------------------------------------
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: ipk-*
          merge-multiple: true
          path: dist

      - name: List files
        run: ls -lR dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          shopt -s nullglob
          files=(dist/*.ipk dist/*.apk)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no package to publish"
            exit 1
          fi
          printf 'publishing %d file(s) to %s\n' "${#files[@]}" "$tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "$tag" --generate-notes
          fi
